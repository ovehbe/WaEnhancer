name: Translation UI test APK
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/wmods/wppenhacer/xposed/features/listeners/ConversationItemListener.kt'
      - 'app/src/main/res/drawable/ic_translate.xml'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/wmods/wppenhacer/App.kt'
      - 'app/src/main/java/com/wmods/wppenhacer/xposed/features/others/GoogleTranslate*.kt'
      - '.github/workflows/translation-ui-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Restore private test signing key
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.TRANSLATION_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TEST_KEYSTORE_BASE64" ]; then
            echo "::error::Add the TRANSLATION_TEST_KEYSTORE_BASE64 repository Actions secret before building."
            exit 1
          fi
          umask 077
          printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/translation-test.jks"
          keytool -exportcert -keystore "$RUNNER_TEMP/translation-test.jks" -storepass android -alias androiddebugkey 2>/dev/null | sha256sum | cut -d ' ' -f 1 > "$RUNNER_TEMP/expected-certificate.txt"
      - name: Build debug APK
        run: |
          bash gradlew testWhatsappDebugUnitTest assembleWhatsappDebug \
            -PtranslationTest=true \
            -PandroidStoreFile="$RUNNER_TEMP/translation-test.jks" \
            -PandroidStorePassword=android \
            -PandroidKeyAlias=androiddebugkey \
            -PandroidKeyPassword=android --console=plain
      - name: Verify test APK identity
        run: |
          apk=$(find app/build/outputs/apk/whatsapp/debug -name '*.apk' -print -quit)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt" dump badging "$apk" > /tmp/apk-badging.txt
          grep -F "package: name='com.wmods.wppenhacer.translationtest'" /tmp/apk-badging.txt
          grep -F "application-label:'WaEnhancer Translation Test'" /tmp/apk-badging.txt
      - name: Verify stable test signing certificate
        run: |
          apk=$(find app/build/outputs/apk/whatsapp/debug -name '*.apk' -print -quit)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certificate.txt"
          expected=$(cat "$RUNNER_TEMP/expected-certificate.txt")
          grep -Fx "Signer #1 certificate SHA-256 digest: $expected" "$RUNNER_TEMP/apk-certificate.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: WaEnhancer-translation-test
          path: app/build/outputs/apk/whatsapp/debug/*.apk
          if-no-files-found: error
